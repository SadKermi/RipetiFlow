[project]
name = "ripetiflow-backend"
version = "0.1.0"
description = "RipetiFlow API: ledger for private tutors (FastAPI + Supabase Postgres)"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "C4"]
ignore = [
    "S101",   # assert is fine in tests
    "RUF001", # Italian text uses typographic characters on purpose
    "RUF002",
    "RUF003",
    "B008",   # FastAPI Depends/Query in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S608"]
"app/dev/**" = ["S311"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
