# Render Blueprint — one Docker web service (D-02). Secrets are set in the dashboard (sync: false).
services:
  - type: web
    name: ripetiflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        value: https://afaowzrghvqnqcovxtqu.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ASSISTANT_PROVIDER
        value: openai
      - key: ASSISTANT_MODEL
        value: gpt-6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: ASSISTANT_DAILY_LIMIT
        value: "60"
