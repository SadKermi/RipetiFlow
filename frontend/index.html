<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="RipetiFlow: il registro delle ripetizioni. Lezioni, pagamenti e saldi di ogni studente."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RipetiFlow</title>
    <script>
      // «Aspetto» in Impostazioni (src/features/settings/theme.ts): applied before the first paint.
      try {
        var theme = localStorage.getItem("ripetiflow.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>RipetiFlow ha bisogno di JavaScript attivo nel browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
